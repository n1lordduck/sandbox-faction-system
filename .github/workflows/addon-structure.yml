name: Addon Structure Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate addon.txt
        run: |
          test -f addon.txt || { echo "::error::addon.txt is missing"; exit 1; }
          fail=0
          for key in name description author version; do
            grep -q "^${key}=" addon.txt || { echo "::error::addon.txt is missing '${key}='"; fail=1; }
          done
          exit $fail

      - name: Validate lua/ folder structure
        run: |
          # Reference: https://wiki.facepunch.com/gmod/Lua_Folder_Structure
          fail=0
          test -d lua || { echo "::error::lua/ folder is missing at the addon root"; exit 1; }

          # Only lua/autorun/** auto-loads. A loose file directly in lua/ needs
          # an explicit include() from somewhere and almost always means it
          # was dropped in the wrong place.
          while IFS= read -r -d '' f; do
            echo "::error file=$f::Loose file directly in lua/ - GMod won't auto-include this. Move it into a subfolder (and include() it explicitly) or into lua/autorun/."
            fail=1
          done < <(find lua -maxdepth 1 -name '*.lua' -print0)

          # SENT (lua/entities/<name>/) and SWEP (lua/weapons/<name>/) folders
          # must at least have a shared.lua.
          for kind in entities weapons; do
            [ -d "lua/$kind" ] || continue
            while IFS= read -r -d '' dir; do
              case "$dir" in
                lua/weapons/gmod_tool) continue ;;  # base toolgun folder; addons only add lua/weapons/gmod_tool/stools/*.lua
              esac
              if [ ! -f "$dir/shared.lua" ]; then
                echo "::error::$dir is missing shared.lua (required for a valid SENT/SWEP folder)"
                fail=1
              fi
            done < <(find "lua/$kind" -mindepth 1 -maxdepth 1 -type d -print0)
          done

          exit $fail
